x-google-cloud-env: &google-cloud-env
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  LLM_PROVIDER: ${LLM_PROVIDER:-vertex}

# The Python services run the same code with different commands. One named image means it is
# built once and stored once, instead of one identical image per service.
x-python-image: &python-image
  build:
    context: .
    dockerfile: Dockerfile.worker
    # A local single-host image needs no provenance attestation; skipping it saves a
    # metadata step per service on every build.
    provenance: false
  image: agentic-trading-python:local

services:
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "sleep 5 && ollama pull llama3.1"
    volumes:
      - ollama_data:/root/.ollama

  worker:
    <<: *python-image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *google-cloud-env
      DB_PATH: /var/lib/stock-experiment/stock_experiment.db
      SCRIPT_STATUS_PATH: /shared/script_status.json
      TRADE_EXECUTION_OUTPUT_PATH: /shared/trade_execution_output.json
      SELECTED_OPTIONS_OUTPUT_PATH: /shared/selected_options_output.json
      AGENT_OUTPUT_PATH: /shared/agent_runner_output.json
      OPTION_IV_HISTORY_PATH: /shared/option_iv_history.json
      TELEMETRY_INSTALLATION_ID_PATH: /shared/telemetry_installation.json
      AUTO_MANAGE_OPTION_POSITIONS: ${WORKER_AUTO_MANAGE_OPTION_POSITIONS:-false}
      OLLAMA_HOST: http://ollama:11434
      MANAGER_OLLAMA_HOST: http://ollama:11434
      STRATEGIST_OLLAMA_HOST: http://ollama:11434
      COMPANY_OPPURUNTIST_OLLAMA_HOST: http://ollama:11434
      INDUSTRY_OPPURUNTINST_OLLAMA_HOST: http://ollama:11434
      SECTOR_OPPURUNTIST_OLLAMA_HOST: http://ollama:11434
      MACRO_NEWS_OLLAMA_HOST: http://ollama:11434
      WORLD_NEWS_OLLAMA_HOST: http://ollama:11434
    volumes:
      - runtime_data:/shared
      - db_data:/var/lib/stock-experiment
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    command: ["python", "Python Scripts/main.py"]

  news_collector:
    <<: *python-image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *google-cloud-env
      DB_PATH: /var/lib/stock-experiment/stock_experiment.db
      NEWS_COLLECTION_OUTPUT_PATH: /shared/agent_pipeline_output.json
      NEWS_COLLECTOR_STATUS_PATH: /shared/news_collector_status.json
      TELEMETRY_INSTALLATION_ID_PATH: /shared/telemetry_installation.json
      OLLAMA_HOST: http://ollama:11434
      MANAGER_OLLAMA_HOST: http://ollama:11434
      STRATEGIST_OLLAMA_HOST: http://ollama:11434
      COMPANY_OPPURUNTIST_OLLAMA_HOST: http://ollama:11434
      INDUSTRY_OPPURUNTINST_OLLAMA_HOST: http://ollama:11434
      SECTOR_OPPURUNTIST_OLLAMA_HOST: http://ollama:11434
      MACRO_NEWS_OLLAMA_HOST: http://ollama:11434
      WORLD_NEWS_OLLAMA_HOST: http://ollama:11434
    volumes:
      - runtime_data:/shared
      - db_data:/var/lib/stock-experiment
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    command: ["python", "Python Scripts/news_collector_main.py"]

  option_manager:
    <<: *python-image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *google-cloud-env
      DB_PATH: /var/lib/stock-experiment/stock_experiment.db
      SCRIPT_STATUS_PATH: /shared/option_manager_status.json
      TRADE_EXECUTION_OUTPUT_PATH: /shared/trade_execution_output.json
      OPTION_POSITION_MANAGEMENT_OUTPUT_PATH: /shared/option_position_management_output.json
      TELEMETRY_INSTALLATION_ID_PATH: /shared/telemetry_installation.json
      AUTO_MANAGE_OPTION_POSITIONS: ${OPTION_MANAGER_AUTO_MANAGE_OPTION_POSITIONS:-true}
      OLLAMA_HOST: http://ollama:11434
      MANAGER_OLLAMA_HOST: http://ollama:11434
      STRATEGIST_OLLAMA_HOST: http://ollama:11434
      COMPANY_OPPURUNTIST_OLLAMA_HOST: http://ollama:11434
      INDUSTRY_OPPURUNTINST_OLLAMA_HOST: http://ollama:11434
      SECTOR_OPPURUNTIST_OLLAMA_HOST: http://ollama:11434
      MACRO_NEWS_OLLAMA_HOST: http://ollama:11434
      WORLD_NEWS_OLLAMA_HOST: http://ollama:11434
    volumes:
      - runtime_data:/shared
      - db_data:/var/lib/stock-experiment
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    command: ["python", "Python Scripts/option_manager_main.py"]

  marketdata_eod_sync:
    <<: *python-image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /var/lib/stock-experiment/stock_experiment.db
      MARKETDATA_EOD_SYNC_STATUS_PATH: /shared/marketdata_eod_sync_status.json
    volumes:
      - runtime_data:/shared
      - db_data:/var/lib/stock-experiment
    command: ["python", "Python Scripts/marketdata_eod_sync_main.py"]

  api:
    <<: *python-image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *google-cloud-env
      DB_PATH: /var/lib/stock-experiment/stock_experiment.db
      SCRIPT_STATUS_PATH: /shared/script_status.json
      OPTION_MANAGER_STATUS_PATH: /shared/option_manager_status.json
      NEWS_COLLECTOR_STATUS_PATH: /shared/news_collector_status.json
      MARKETDATA_EOD_SYNC_STATUS_PATH: /shared/marketdata_eod_sync_status.json
      TRADE_EXECUTION_OUTPUT_PATH: /shared/trade_execution_output.json
      SELECTED_OPTIONS_OUTPUT_PATH: /shared/selected_options_output.json
      AGENT_OUTPUT_PATH: /shared/agent_runner_output.json
      OPTION_IV_HISTORY_PATH: /shared/option_iv_history.json
      OPTION_POSITION_MANAGEMENT_OUTPUT_PATH: /shared/option_position_management_output.json
      TELEMETRY_INSTALLATION_ID_PATH: /shared/telemetry_installation.json
    volumes:
      - runtime_data:/shared
      - db_data:/var/lib/stock-experiment
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["python", "api.py"]

  web:
    build:
      context: ./web_dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # nginx fills ${DASHBOARD_DOMAIN} into its config templates at start.
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      news_collector:
        condition: service_started
      option_manager:
        condition: service_started

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped

volumes:
  runtime_data:
  ollama_data:
  db_data:
