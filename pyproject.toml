[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "stock-trading-experiment"
version = "0.1.0"
description = "Agentic news-to-options research and trading pipeline."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Parallel test runs, `project.py test --changed` and coverage: pip install -e ".[dev]"
dev = ["pytest>=8", "pytest-xdist>=3", "pytest-testmon>=2.2", "pytest-cov>=5", "ruff>=0.15"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["graft", "web_dashboard", "html_pages", "docs", "shared", "stock-backup-*"]

[tool.ruff.lint]
# Bug-finding rules only: pyflakes, syntax errors, and the bugbear checks for shared mutable
# defaults, call defaults, blind assertRaises and closures over loop variables. No style rules.
select = ["F", "E9", "B006", "B008", "B017", "B023"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares query parameters through call defaults.
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules define each package's public names by importing them.
"__init__.py" = ["F401"]
# The package facade re-exports its private modules' names.
"Python Scripts/trading_support/option_positions.py" = ["F401", "F403"]

# python -m pytest -n auto --cov --cov-report=term-missing
[tool.coverage.run]
source = [".", "Data", "Python Scripts", "api_routes", "api_support"]
omit = ["tests/*", "graft/*", "web_dashboard/*", "stock-backup-*/*", "scripts/kaggle/*"]
parallel = true

[tool.coverage.report]
skip_empty = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecations inside installed packages, which this project cannot fix.
filterwarnings = [
    "ignore::DeprecationWarning:google.genai.types",
    "ignore::DeprecationWarning:websockets.legacy",
]

# This is an application run from its checkout, so install it editable:
#     pip install -e .
# Development mode adds the import roots below to sys.path through a .pth file.
# They are the only import roots; modules must not edit sys.path themselves.
[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = [
    ".",
    "Data",
    "Python Scripts",
    "Python Scripts/agentCallers",
    "Python Scripts/Webscraping",
]
