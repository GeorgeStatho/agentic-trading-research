name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the python:3.11 base of Dockerfile.worker.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            pyproject.toml
      - name: Install
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: ruff check --output-format github .
      - name: Test
        run: python scripts/project.py test
      - name: End-to-end
        run: python scripts/project.py test --e2e

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the node:24 base of web_dashboard/Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: web_dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
