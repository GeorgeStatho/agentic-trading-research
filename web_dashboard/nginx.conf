limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=page_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=telemetry_limit:1m rate=1r/m;

server {
  listen 80;
  server_name ${DASHBOARD_DOMAIN};

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name ${DASHBOARD_DOMAIN};

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/${DASHBOARD_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DASHBOARD_DOMAIN}/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # The JS bundle and the API's JSON compress to about a third of their size.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # This app never serves executable scripts or sensitive dotfiles directly.
  location ~ /\.(?!well-known/) {
    return 444;
  }

  location ~* ^/(?:cgi-bin/|wp-admin/|wp-login\.php|xmlrpc\.php|vendor/|phpinfo\.php) {
    return 444;
  }

  location ~* \.(?:php|pl|cgi|asp|aspx|jsp|sh)$ {
    return 444;
  }

  # Startup pings from clones are the one write the public dashboard accepts.
  location = /api/telemetry/startup {
    limit_req zone=telemetry_limit burst=8 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    client_max_body_size 2k;

    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:5000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    # The dashboard is read-only: model runs, backtests and data fetches are not reachable from outside.
    limit_except GET HEAD { deny all; }

    # Re-resolve via Docker DNS so a recreated api container (new IP) doesn't
    # leave nginx proxying to a stale address until the next reload.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:5000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Vite puts a content hash in every asset name, so a cached copy never goes stale.
  location /assets/ {
    limit_req zone=page_limit burst=60 nodelay;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html names the current hashed assets, so browsers must check it on every load.
  location = /index.html {
    limit_req zone=page_limit burst=60 nodelay;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-cache";
  }

  location / {
    limit_req zone=page_limit burst=60 nodelay;
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
  }
}
