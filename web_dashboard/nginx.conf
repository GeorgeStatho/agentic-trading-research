limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=page_limit:10m rate=30r/s;

server {
  listen 80;
  server_name dashboard.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name dashboard.example.com;

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # This app never serves executable scripts or sensitive dotfiles directly.
  location ~ /\.(?!well-known/) {
    return 444;
  }

  location ~* ^/(?:cgi-bin/|wp-admin/|wp-login\.php|xmlrpc\.php|vendor/|phpinfo\.php) {
    return 444;
  }

  location ~* \.(?:php|pl|cgi|asp|aspx|jsp|sh)$ {
    return 444;
  }

  # A browser navigation to this route triggers the native Basic Auth prompt.
  # Fetch requests deliberately do not display that prompt, so the dashboard
  # links administrators here before they use a protected write action.
  location = /admin-login {
    auth_basic "Agentic Trading — administrative access";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    try_files /index.html =404;
  }

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    # The dashboard and read-only data remain public. Every non-read request
    # requires the server-local Basic Auth credentials before Flask sees it.
    # This covers model runs, backtest creation, market-data fetches, and
    # telemetry writes without exposing the password file to the repository.
    limit_except GET HEAD OPTIONS {
      auth_basic "Agentic Trading — administrative access";
      auth_basic_user_file /etc/nginx/auth/.htpasswd;
    }

    # Re-resolve via Docker DNS so a recreated api container (new IP) doesn't
    # leave nginx proxying to a stale address until the next reload.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:5000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    limit_req zone=page_limit burst=60 nodelay;
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
  }
}
