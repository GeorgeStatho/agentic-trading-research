limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=page_limit:10m rate=30r/s;

server {
  listen 80;
  server_name dashboard.example.com;

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Match the hardened production rules during bootstrap mode too.
  location ~ /\.(?!well-known/) {
    return 444;
  }

  location ~* ^/(?:cgi-bin/|wp-admin/|wp-login\.php|xmlrpc\.php|vendor/|phpinfo\.php) {
    return 444;
  }

  location ~* \.(?:php|pl|cgi|asp|aspx|jsp|sh)$ {
    return 444;
  }

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_except GET POST HEAD OPTIONS { deny all; }

    proxy_pass http://api:5000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req zone=page_limit burst=60 nodelay;
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
  }
}
