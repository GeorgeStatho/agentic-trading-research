limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=page_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=telemetry_limit:1m rate=1r/m;

server {
  listen 80;
  server_name ${DASHBOARD_DOMAIN};

  server_tokens off;

  # Behind the tunnel every request comes from cloudflared on the Docker network; take the visitor's
  # address from Cloudflare's header so each limit applies per visitor.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  root /usr/share/nginx/html;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Match the hardened production rules during bootstrap mode too.
  location ~ /\.(?!well-known/) {
    return 444;
  }

  location ~* ^/(?:cgi-bin/|wp-admin/|wp-login\.php|xmlrpc\.php|vendor/|phpinfo\.php) {
    return 444;
  }

  location ~* \.(?:php|pl|cgi|asp|aspx|jsp|sh)$ {
    return 444;
  }

  # Startup pings from clones are the one write the public dashboard accepts.
  location = /api/telemetry/startup {
    limit_req zone=telemetry_limit burst=8 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    client_max_body_size 2k;

    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:5000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    # The dashboard is read-only: model runs, backtests and data fetches are not reachable from outside.
    limit_except GET HEAD { deny all; }

    # Re-resolve via Docker DNS so a recreated api container (new IP) doesn't
    # leave nginx proxying to a stale address until the next reload.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:5000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req zone=page_limit burst=60 nodelay;
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
  }
}
