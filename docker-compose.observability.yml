# Optional monitoring overlay. Start it alongside the main stack so it joins the same network:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d dozzle uptime_kuma
# Both UIs bind to localhost only; reach them from another machine through an SSH tunnel.
services:
  # Live tail and search across every container's stdout.
  dozzle:
    image: amir20/dozzle:v8.12.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8081:8080"

  # Uptime checks and alerts. Add an HTTP monitor on http://api:5000/api/health/components
  # (503 when a loop is down, stalled or failed in the last hour) and a notification channel in its UI.
  uptime_kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  uptime_kuma_data:
